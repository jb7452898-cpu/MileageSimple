<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in</title>
  <style>
    body {
      font-family: system-ui;
      margin: 16px;
      max-width: 720px;
      background-color: #000;
      color: #8fd3ff;  /* light blue */
    }

    h2, h3 { color: #8fd3ff; }

    input, button {
      font-size: 18px;
      padding: 10px;
      background-color: #111;
      color: #8fd3ff;
      border: 1px solid #8fd3ff;
    }

    button:hover {
      background-color: #8fd3ff;
      color: #000;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .err {
      margin-top: 12px;
      color: #ff7aa2;
      font-weight: 700;
    }

    .hint {
      margin-top: 14px;
      font-size: 14px;
      opacity: 0.9;
      max-width: 60ch;
    }
  </style>
</head>

<body>
  <h2>Log in</h2>

  <form method="POST" class="row">
    <input
      name="username"
      autocomplete="username"
      placeholder="Username"
      required
    >

    <input
      name="pin"
      type="password"
      inputmode="numeric"
      autocomplete="current-password"
      placeholder="PIN (4+ digits)"
      minlength="4"
      required
    >

    <button type="submit">Continue</button>
  </form>

  {% if error %}
    <div class="err">{{ error }}</div>
  {% endif %}

  <p class="hint">
    PIN is required for all users. If this is your first time, you’ll set your PIN now.
  </p>
</body>
</html>
