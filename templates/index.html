<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Float Logger</title>
<style>
  body {
    font-family: system-ui;
    margin: 16px;
    max-width: 720px;
    background-color: #000;
    color: #8fd3ff;  /* light blue */
  }

  h2, h3 {
    color: #8fd3ff;
  }

  input, button {
    font-size: 18px;
    padding: 10px;
    background-color: #111;
    color: #8fd3ff;
    border: 1px solid #8fd3ff;
  }

  button:hover {
    background-color: #8fd3ff;
    color: #000;
    cursor: pointer;
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  #total {
    font-weight: 800;
    margin-top: 14px;
  }

  ul {
    padding-left: 18px;
  }

  a {
    color: #8fd3ff;
  }

  #listWrap {
  margin-top: 8px;
  border: 1px solid #8fd3ff;
  background: #000;
  max-height: 360px;     /* adjust */
  overflow-y: auto;
  padding: 10px;
}

#list {
  margin: 0;
}

#list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
}
#list li button {
  font-size: 14px;
  padding: 6px 10px;
}

.entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  transition: opacity 180ms ease, transform 180ms ease;
}

.entry.removing {
  opacity: 0;
  transform: translateX(8px);
}

.entry .actions {
  display: flex;
  gap: 8px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 14px;
}

.stat-card {
  border: 1px solid #8fd3ff;
  background: #111;
  padding: 12px;
}

.stat-label {
  font-size: 13px;
  opacity: 0.85;
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
  margin-top: 4px;
}

#chartWrap {
  margin-top: 16px;
  border: 1px solid #8fd3ff;
  background: #111;
  padding: 10px;
}

#chartTitle {
  margin: 0 0 8px 0;
}

#chart {
  width: 100%;
  height: 260px;
  display: block;
  background: #000;
  border: 1px solid #8fd3ff;
}

.chart-empty {
  padding: 24px;
  text-align: center;
  opacity: 0.8;
}


</style>

</head>
<body>

<form method="POST" action="/logout">
  <button type="submit">Log out</button>
</form>




  <h2 id="title">Mileage Tracker</h2>

<div class="row">
  <input type="date" id="date">
  <input id="value" inputmode="decimal" placeholder="Enter a number">
  <button id="add">Add</button>
</div>

  <div id="total">Total: 0.00</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-label">Entries</div>
    <div class="stat-value" id="statCount">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Highest Entry</div>
    <div class="stat-value" id="statMax">0.00</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Avg / Entry</div>
    <div class="stat-value" id="statAvgEntry">0.00</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Avg / Day</div>
    <div class="stat-value" id="statAvgDay">0.00</div>
  </div>
</div>

<div id="chartWrap">
  <h3 id="chartTitle">Mileage Over Time</h3>
  <svg id="chart" viewBox="0 0 700 260" preserveAspectRatio="none"></svg>
</div>

  <label style="display:block; margin-top:10px;">
  <input type="checkbox" id="oldestFirst">
  Oldest first
</label>

<h3>Entries</h3>
<div id="listWrap">
  <ul id="list"></ul>
</div>

<div class="row" style="margin-top: 10px;">
  <button type="button" onclick="window.location.href='/download'">
    Download data (CSV)
  </button>
</div>

<script>
  const valueEl = document.getElementById("value");
  const dateEl  = document.getElementById("date");
  const totalEl = document.getElementById("total");
  const listEl  = document.getElementById("list");
  const titleEl = document.getElementById("title"); // if you added id="title"
  const oldestFirstEl = document.getElementById("oldestFirst");

  const statCountEl = document.getElementById("statCount");
  const statMaxEl = document.getElementById("statMax");
  const statAvgEntryEl = document.getElementById("statAvgEntry");
  const statAvgDayEl = document.getElementById("statAvgDay");
  const chartEl = document.getElementById("chart");

    function escapeXml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&apos;");
  }

  function drawChart(entries) {
    const width = 700;
    const height = 260;
    const padLeft = 52;
    const padRight = 18;
    const padTop = 18;
    const padBottom = 38;

    if (!entries.length) {
      chartEl.innerHTML = `
        <text x="350" y="130" text-anchor="middle" fill="#8fd3ff" font-size="16">
          No data yet
        </text>
      `;
      return;
    }

    const chronological = [...entries].sort((a, b) => {
      if (a.date === b.date) return a.id - b.id;
      return a.date.localeCompare(b.date);
    });

    const values = chronological.map(e => Number(e.value));
    const minValue = Math.min(...values);
    const maxValue = Math.max(...values);

    const range = maxValue - minValue || 1;

    const xFor = (i) => {
      if (chronological.length === 1) return (padLeft + width - padRight) / 2;
      const usable = width - padLeft - padRight;
      return padLeft + (i / (chronological.length - 1)) * usable;
    };

    const yFor = (v) => {
      const usable = height - padTop - padBottom;
      return padTop + (1 - ((v - minValue) / range)) * usable;
    };

    const points = chronological.map((e, i) => `${xFor(i)},${yFor(e.value)}`).join(" ");

    const yTicks = 4;
    let html = "";

    for (let i = 0; i <= yTicks; i++) {
      const t = i / yTicks;
      const y = padTop + t * (height - padTop - padBottom);
      const val = maxValue - t * range;

      html += `
        <line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}"
              stroke="#24485c" stroke-width="1" />
        <text x="${padLeft - 8}" y="${y + 4}" text-anchor="end"
              fill="#8fd3ff" font-size="11">${fmt2(val)}</text>
      `;
    }

    html += `
      <line x1="${padLeft}" y1="${height - padBottom}" x2="${width - padRight}" y2="${height - padBottom}"
            stroke="#8fd3ff" stroke-width="1.5" />
      <line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${height - padBottom}"
            stroke="#8fd3ff" stroke-width="1.5" />
    `;

    if (chronological.length >= 1) {
      const first = chronological[0];
      const last = chronological[chronological.length - 1];

      html += `
        <text x="${padLeft}" y="${height - 12}" text-anchor="start"
              fill="#8fd3ff" font-size="11">${escapeXml(first.date)}</text>
        <text x="${width - padRight}" y="${height - 12}" text-anchor="end"
              fill="#8fd3ff" font-size="11">${escapeXml(last.date)}</text>
      `;
    }

    html += `
      <polyline
        fill="none"
        stroke="#8fd3ff"
        stroke-width="3"
        points="${points}"
      />
    `;

    for (let i = 0; i < chronological.length; i++) {
      const e = chronological[i];
      const x = xFor(i);
      const y = yFor(e.value);

      html += `
        <circle cx="${x}" cy="${y}" r="4" fill="#8fd3ff">
          <title>${escapeXml(e.date)} — ${fmt2(e.value)}</title>
        </circle>
      `;
    }

    chartEl.innerHTML = html;
  }

  if (oldestFirstEl) {
    oldestFirstEl.addEventListener("change", refresh);
  }

  function fmt2(x) { return Number(x).toFixed(2); }

  /////// async function refresh

  async function refresh() {
    const oldest = oldestFirstEl && oldestFirstEl.checked ? "1" : "0";
  const res = await fetch(`/api/entries?oldest=${oldest}`);
  const data = await res.json();


    if (titleEl && data.username) {
      titleEl.textContent = "Mileage Tracker for " + data.username;
    }

    totalEl.textContent = "Total: " + fmt2(data.total);

    const stats = data.stats || {};
    statCountEl.textContent = stats.count ?? 0;
    statMaxEl.textContent = fmt2(stats.max_value ?? 0);
    statAvgEntryEl.textContent = fmt2(stats.avg_per_entry ?? 0);
    statAvgDayEl.textContent = fmt2(stats.avg_per_day ?? 0);

    drawChart(data.entries || []);

    listEl.replaceChildren();
    const frag = document.createDocumentFragment();

    for (const e of data.entries) {
      const li = document.createElement("li");
      li.className = "entry";

      const span = document.createElement("span");
      span.textContent = `${e.date} — ${fmt2(e.value)}`;

      const actions = document.createElement("span");
      actions.className = "actions";

      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";

      delBtn.onclick = () => {
        // swap buttons inline (no browser confirm popup)
        actions.replaceChildren();

        const confirmBtn = document.createElement("button");
        confirmBtn.textContent = "Confirm";

        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "Cancel";

        cancelBtn.onclick = () => {
          actions.replaceChildren(delBtn);
        };

        confirmBtn.onclick = async () => {
          // animate out immediately
          li.classList.add("removing");

          const resp = await fetch(`/api/entries/${e.id}`, { method: "DELETE" });
          if (!resp.ok) {
            li.classList.remove("removing");
            const t = await resp.text();
            alert("Delete failed: " + t);
            actions.replaceChildren(delBtn);
            return;
          }

          // wait for fade-out, then refresh list/total
          setTimeout(refresh, 200);
        };

        actions.appendChild(confirmBtn);
        actions.appendChild(cancelBtn);
      };

      actions.appendChild(delBtn);

      li.appendChild(span);
      li.appendChild(actions);
      frag.appendChild(li);
    }

    listEl.appendChild(frag);
  }

    /////// end refresh block

  document.getElementById("add").onclick = async () => {
    const rawValue = valueEl.value.trim();
    const rawDate = dateEl.value;

    if (!rawValue || !rawDate) {
      alert("Please enter both date and value");
      return;
    }

    const num = Number(rawValue);
    if (!Number.isFinite(num)) {
      alert("Invalid number");
      return;
    }

    const resp = await fetch("/api/entries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: num, date: rawDate })
    });

    if (!resp.ok) {
      const t = await resp.text();
      alert("Save failed: " + t);
      return;
    }

    valueEl.value = "";
    await refresh();
  };

  // default date to today
  dateEl.value = new Date().toISOString().slice(0, 10);

  refresh();


</script>


</body>
</html>
